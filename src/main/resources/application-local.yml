# @owner BSJ — 로컬 프로필 (docker-compose DB). 비밀값은 application-local-secret.yml(커밋 금지)에
spring:
  config:
    import: optional:classpath:application-local-secret.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpnest}
    username: ${DB_USERNAME:helpnest}
    password: ${DB_PASSWORD:helpnest}
  flyway:
    # 시드(R__seed_*)는 로컬에서만. 운영(prod)은 기본값 db/migration 만 사용 (docs/03 §5)
    locations: classpath:db/migration, classpath:db/seed

# 로컬 개발 전용 기본값 (운영 비밀 아님). 운영(prod)은 기본값 없이 JWT_SECRET 필수
jwt:
  secret: ${JWT_SECRET:helpnest-local-dev-only-secret-change-me-32bytes+}
