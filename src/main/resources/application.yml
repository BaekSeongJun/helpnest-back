# @owner BSJ — 공용 설정. 도메인 전용 설정은 각자 파일로 분리 (docs/01 §4.2)
spring:
  application:
    name: helpnest-back
  config:
    import:
      - optional:classpath:application-ws.yml   # 박민재
      - optional:classpath:application-ai.yml   # 신수진
      - optional:classpath:application-aws.yml  # 신수진
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway로만 변경
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    out-of-order: true     # 3명이 각자 만든 마이그레이션을 버전 순서와 무관하게 적용
  jackson:
    time-zone: Asia/Seoul
  task:
    execution:            # @Async 공용 풀 (AsyncConfig)
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
      shutdown:
        await-termination: true          # 종료 시 진행 중인 AI 분류 등을 마치고 내려감
        await-termination-period: 30s
  servlet:
    multipart:
      max-file-size: 10MB      # 첨부 파일당 (FR-INQ-02)
      max-request-size: 55MB   # 5개 × 10MB + 여유

jwt:
  secret: ${JWT_SECRET}      # HS256 → 32바이트 이상. 운영 값은 환경변수로만
  access-ttl: 30m
  refresh-ttl: 14d
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}   # 로컬 http 개발 시 false

app:
  # CORS 허용(/api/attachments, /ws 만)·메일 링크. 운영은 Amplify 도메인 필수 — 기본값을 두지 않아 빠뜨리면 기동 실패
  front-origin: ${FRONT_ORIGIN}

server:
  forward-headers-strategy: framework   # 프록시·CloudFront 뒤 실제 클라이언트 IP 사용 (docs/02 §2.1)

management:
  endpoints:
    web:
      exposure:
        include: health
